<title>No Biggie, I'm Fine</title>
<meta name="description" content="A collection of stories, things, and creatures for whatever you're carrying.">
<style>
/*FONTS*/
/* Layout: alternating torn-paper bands (paper cream / night ink) on a 1240px column; art bleeds right, notes scrawled in the margins */
:root{
  --paper:#F1ECE0;      /* page ground */
  --paper-hi:#FAF7EF;   /* torn fiber rim */
  --ink:#0F0F0E;        /* type + line work on paper */
  --night:#131312;      /* dark bands */
  --night-2:#191918;    /* stories band */
  --slate:#272726;      /* story cards */
  --abyss:#050505;      /* creature bodies */
  --fog:#CEC8BA;        /* secondary type on dark */
  --smoke:#55524B;      /* secondary type on paper */
  --hand:'Covered By Your Grace','Marker Felt','Chalkboard SE','Comic Sans MS',cursive;
  --serif:'Instrument Serif','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --gutter:clamp(16px,4.6vw,64px);
  --maxw:1240px;
  --fs-0:12px; --fs-1:13px; --fs-2:14.5px;
  --grain-paper:url(/*PAPERGRAIN*/);
  --grain-night:url(/*NIGHTGRAIN*/);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 var(--fs-1)/1.75 var(--mono);letter-spacing:.08em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
/* paper grain */
body{background-image:var(--grain-paper);background-size:160px 160px}
a{color:inherit}
img,svg{max-width:100%}
p{margin:0}
h1,h2,h3{margin:0;font-weight:400}
button{font:inherit;letter-spacing:inherit;color:inherit}
:focus-visible{outline:2px dashed currentColor;outline-offset:4px}

.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.caps{text-transform:uppercase}
.hand{font-family:var(--hand);letter-spacing:.01em;text-transform:uppercase;font-weight:400;line-height:.9;-webkit-text-stroke:.022em currentColor;paint-order:stroke fill}

/* ---------- shared bits ---------- */
.arr{width:20px;height:10px;flex:none;transition:transform .2s ease}
a:hover .arr,button:hover .arr{transform:translateX(4px)}
.rule{display:block;height:8px;flex:1 1 auto;min-width:40px;max-width:420px;overflow:visible}
.scrib{display:block;height:10px;overflow:visible}
.sec-head{display:flex;align-items:center;gap:clamp(14px,2vw,26px)}
.sec-head h2{font-size:clamp(34px,3.4vw,46px);transform:rotate(-4deg);transform-origin:left center;white-space:nowrap}
.sec-head .more{margin-left:auto;display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-0);text-transform:uppercase;letter-spacing:.14em;text-decoration:none;font-weight:500;white-space:nowrap;padding-block:6px}
.sec-head .more:hover{text-decoration:underline;text-underline-offset:5px}

.btn{
  display:inline-flex;align-items:center;gap:14px;padding:13px 20px 12px;font-size:var(--fs-1);font-weight:500;
  text-transform:uppercase;letter-spacing:.14em;text-decoration:none;border:1.5px solid transparent;cursor:pointer;
  transition:box-shadow .18s ease,transform .18s ease,background-color .18s ease,color .18s ease;
}
.btn:hover{transform:translate(-2px,-2px)}
.btn--ink{background:var(--ink);color:var(--paper)}
.btn--ink:hover{box-shadow:4px 4px 0 rgba(15,15,14,.28)}
.btn--paper{background:var(--paper);color:var(--ink)}
.btn--paper:hover{box-shadow:4px 4px 0 rgba(241,236,224,.25)}
.btn--line{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn--line:hover{background:var(--ink);color:var(--paper)}

.textlink{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-0);font-weight:500;text-transform:uppercase;letter-spacing:.14em;
  text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px;background:none;border:0;padding:4px 0;cursor:pointer}

.note{font-family:var(--hand);text-transform:uppercase;line-height:1.02;font-size:clamp(19px,1.75vw,25px);letter-spacing:.02em}
.note .scrib{width:60%;margin-top:8px}

/* ---------- art ---------- */
.art{display:block;width:100%;height:auto;overflow:visible}
.p-ink{fill:var(--ink);fill-rule:evenodd}
.p-mid{fill:var(--ink);fill-opacity:.36;fill-rule:evenodd}
.p-body{fill:var(--abyss);fill-rule:evenodd}
.p-lite{fill:var(--paper);fill-rule:evenodd}
.ew{fill:var(--paper)}
.pp{fill:var(--abyss);transition:transform .14s ease-out}
.lid{transform-box:fill-box;transform-origin:center;transition:transform .08s ease-in}
.blink .lid{transform:scaleY(.08)}
.rain line{stroke:var(--paper);stroke-width:.85;stroke-linecap:round}
.rain{animation:rain .85s linear infinite}
@keyframes rain{from{transform:translate(0,0)}to{transform:translate(-15.8px,72px)}}
.twinkle{fill:var(--paper);transform-box:fill-box;transform-origin:center;animation:twinkle 3.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.95;transform:scale(1)}50%{opacity:.25;transform:scale(.6)}}

/* ---------- torn edges ---------- */
.band{position:relative}
.tear{position:absolute;left:0;width:100%;height:clamp(14px,2.3vw,30px);pointer-events:none;z-index:3;display:block}
.tear--top{top:1px;transform:translateY(-100%)}
.tear--bottom{bottom:1px;transform:translateY(100%) scaleY(-1)}
.dark{background:var(--night);color:var(--paper)}
.dark::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain-night);background-size:160px 160px}
.dark > *{position:relative}
.dark > .tear{position:absolute}

/* ---------- header ---------- */
.top{padding-block:22px 0}
.top .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
.logo{font-family:var(--hand);text-transform:uppercase;font-size:27px;line-height:.86;display:inline-block;transform:rotate(-8deg);text-decoration:none;-webkit-text-stroke:.02em currentColor;justify-self:start;padding:6px 2px}
.logo span{display:block}
.logo span + span{padding-left:.55em}
.nav{display:flex;gap:clamp(18px,3.2vw,46px);list-style:none;margin:0;padding:0}
.nav a{font-size:var(--fs-0);font-weight:500;letter-spacing:.14em;text-decoration:none;text-transform:uppercase;padding:6px 0;position:relative}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .2s ease}
.nav a:hover::after{transform:scaleX(1)}
.cart-btn{justify-self:end;background:none;border:0;cursor:pointer;font-size:var(--fs-0);font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:6px 0;font-variant-numeric:tabular-nums}
.cart-btn.bump{animation:bump .4s ease}
@keyframes bump{40%{transform:scale(1.14) rotate(-3deg)}}

/* ---------- hero ---------- */
.hero{padding-block:clamp(40px,6vw,96px) clamp(80px,9vw,150px);min-height:clamp(600px,86vh,940px);display:flex;align-items:center}
.hero > .wrap{width:100%}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(16px,3vw,48px);align-items:center}
.hero-copy{min-width:0;position:relative;z-index:2}
.hero h1{font-size:clamp(56px,8.6vw,126px);white-space:nowrap;transform:rotate(-3.5deg);transform-origin:left bottom}
.hero h1 span{display:block}
.hero h1 span + span{padding-left:.16em}
.hero-sub{margin-top:clamp(20px,2.6vw,34px);max-width:46ch;text-transform:uppercase;font-size:var(--fs-1)}
.hero-copy .btn{margin-top:clamp(18px,2vw,26px)}
.hero-art{position:relative;margin:0;min-width:0}
.hero-art .note{position:absolute;right:-1%;top:7%;transform:rotate(-8deg);width:5.4em}

/* ---------- featured ---------- */
.featured{padding-block:clamp(44px,5vw,64px) clamp(40px,4vw,56px)}
.featured .wrap{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(20px,3vw,40px);align-items:center}
.eyebrow{white-space:nowrap;display:flex;align-items:center;gap:18px;font-size:var(--fs-0);font-weight:500;letter-spacing:.16em;text-transform:uppercase;margin-bottom:clamp(22px,3vw,40px)}
.eyebrow b{font-weight:500;position:relative;padding-bottom:7px}
.eyebrow b::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:currentColor;opacity:.85}
.featured h2{white-space:nowrap;font-size:clamp(56px,7.4vw,106px);transform:rotate(-5deg);transform-origin:left center}
.featured h2 span{display:block}
.featured h2 span + span{padding-left:.04em}
.feat-body{margin-top:clamp(24px,3.4vw,46px);padding-left:0}
.feat-body p{text-transform:uppercase;color:var(--fog)}
.feat-body .btn{margin-top:clamp(20px,2.4vw,30px)}
.feat-art{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px}
.feat-art .note{transform:rotate(-12deg);width:5.6em;align-self:center;margin-top:-14%}
.feat-art .note .scrib{width:70%}

/* ---------- stories ---------- */
.stories{background-color:var(--night-2);padding-block:clamp(36px,4vw,52px) clamp(48px,5vw,72px)}
.stories .sec-head{margin-bottom:clamp(22px,2.6vw,34px)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.2vw,16px)}
.card{position:relative;background:var(--slate);padding:clamp(18px,2vw,26px) clamp(18px,2vw,28px) clamp(22px,2.2vw,28px);display:flex;flex-direction:column;min-width:0;color:var(--paper)}
.card-art{height:clamp(116px,12.6vw,184px);display:flex;align-items:flex-end;justify-content:center;margin-bottom:clamp(18px,2vw,24px)}
.card-art .art{width:calc(var(--aw) * 1px * var(--k,1.6));max-width:100%;max-height:100%;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.card:hover .card-art .art{transform:translateY(-6px) rotate(-1.5deg)}
.card h3{font-family:var(--mono);font-weight:500;font-size:var(--fs-2);letter-spacing:.1em;text-transform:uppercase;line-height:1.45}
.card p{margin-top:12px;text-transform:uppercase;color:var(--fog);font-size:var(--fs-0);line-height:1.75}
.card .textlink{margin-top:auto;padding-top:20px;align-self:flex-start}
.card .stretch::before{content:"";position:absolute;inset:0}

/* ---------- practices ---------- */
.practices{padding-block:clamp(48px,5.4vw,76px) clamp(48px,5vw,70px)}
.practices .sec-head{margin-bottom:clamp(12px,1.5vw,20px)}
.prac-hero{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.34fr);gap:clamp(16px,2.5vw,36px);align-items:end}
.prac-hero h2{margin-top:clamp(18px,2.4vw,34px);white-space:nowrap;font-size:clamp(46px,5.1vw,74px);transform:rotate(-6deg);transform-origin:left center;margin-left:clamp(0px,1.6vw,24px)}
.prac-hero h2 span{display:block}
.prac-hero h2 span + span{padding-left:.02em}
.prac-copy{padding-bottom:clamp(10px,2vw,30px);min-width:0}
.prac-copy p{margin-top:clamp(22px,3vw,40px);text-transform:uppercase;max-width:34ch;margin-left:clamp(0px,1.6vw,24px)}
.prac-copy .btn{margin-top:clamp(20px,2.6vw,30px);margin-left:clamp(0px,1.6vw,24px)}
.prac-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:clamp(34px,4vw,54px)}
.prac{display:flex;flex-direction:column;padding:4px clamp(14px,2.4vw,40px) 4px;min-width:0;background-image:linear-gradient(var(--ink) 55%,transparent 0);background-size:1.2px 7px;background-repeat:repeat-y;background-position:left top}
.prac:first-child{background:none;padding-left:clamp(0px,1vw,16px)}
.prac-icon{height:clamp(56px,6vw,76px);display:flex;align-items:flex-end;margin-bottom:16px}
.prac-icon .art{height:100%;width:auto}
.prac h3{font-family:var(--mono);font-weight:500;font-size:var(--fs-2);letter-spacing:.12em;text-transform:uppercase}
.prac p{margin-top:12px;text-transform:uppercase;font-size:var(--fs-0);color:var(--smoke)}
.prac .textlink{margin-top:auto;padding-top:20px;align-self:flex-start}

/* ---------- about ---------- */
.about{padding-block:clamp(40px,4.4vw,58px) clamp(10px,1.5vw,20px)}
.about .wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr);gap:clamp(16px,2vw,30px);align-items:center}
.about-copy{padding-bottom:clamp(20px,3vw,44px);min-width:0}
.about-copy p{margin-top:clamp(16px,2vw,26px);text-transform:uppercase;max-width:40ch;font-size:var(--fs-1)}
.about-copy .btn{margin-top:clamp(20px,2.4vw,30px)}
.about .sec-head h2{transform:rotate(-7deg)}
.about-art{margin-right:calc(-1 * var(--gutter));min-width:0}

/* ---------- shop ---------- */
.shop{padding-block:clamp(40px,4.4vw,60px) clamp(46px,5vw,68px)}
.shop .wrap{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,2fr);gap:clamp(18px,3vw,44px);align-items:center}
.shop-copy p{margin-top:clamp(16px,2vw,24px);text-transform:uppercase;max-width:30ch}
.shop-copy .btn{margin-top:clamp(18px,2.2vw,26px)}
.shelf{--g:clamp(14px,2vw,28px);display:flex;align-items:center;gap:clamp(8px,1.4vw,18px);min-width:0}
.rail{display:flex;gap:var(--g);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:10px 4px 6px;min-width:0;flex:1 1 auto}
.rail::-webkit-scrollbar{display:none}
.shelf.all .rail{flex-wrap:wrap;overflow:visible;justify-content:flex-start}
.shelf.all .rail-next{display:none}
.product{flex:0 0 calc((100% - 3 * var(--g)) / 4);scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:center;position:relative}
.p-frame{width:100%;aspect-ratio:84/107;max-width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.p-frame > .art{width:100%;height:100%;transition:transform .25s ease}
.product:hover .p-frame > .art,.product:focus-visible .p-frame > .art,.product:hover .zine,.product:hover .stickers{transform:translateY(-5px) rotate(-2deg)}
.p-name{font-weight:500;font-size:var(--fs-0);letter-spacing:.14em;text-transform:uppercase;line-height:1.3}
.p-price{font-size:var(--fs-0);letter-spacing:.1em;font-variant-numeric:tabular-nums;line-height:1}
.p-add{position:absolute;top:4px;right:4px;background:var(--ink);color:var(--paper);font-size:10.5px;font-weight:500;letter-spacing:.12em;padding:4px 7px 3px;opacity:0;transform:translateY(4px);transition:opacity .18s ease,transform .18s ease}
.product:hover .p-add,.product:focus-visible .p-add{opacity:1;transform:none}
@media (hover:none){.p-add{opacity:1;transform:none}}
.rail-next{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;display:grid;place-items:center;cursor:pointer;transition:background-color .18s ease,color .18s ease}
.rail-next:hover{background:var(--ink);color:var(--paper)}
.zine,.stickers{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.zine{background:var(--night);color:var(--paper);padding:12% 10% 10%;gap:6%;box-shadow:inset 0 0 0 3px var(--night),inset 0 0 0 4.5px rgba(241,236,224,.5)}
.zine .zt{font-family:var(--hand);text-transform:uppercase;font-size:clamp(17px,1.7vw,23px);line-height:.9;transform:rotate(-5deg);text-align:center}
.zine .art{width:80%;height:auto}
.stickers{border:1.5px solid rgba(15,15,14,.55);background:var(--paper-hi);display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:10%;gap:6%}
.stickers .dot{width:100%;aspect-ratio:1;border-radius:50%;background:var(--night);display:grid;place-items:center;outline:1.5px dashed rgba(15,15,14,.45);outline-offset:3px;overflow:hidden}
.stickers .dot .art{width:88%;height:auto}
.zine,.stickers{transition:transform .25s ease}
.stickers .dot:nth-child(2){transform:rotate(9deg)}
.stickers .dot:nth-child(3){transform:rotate(-8deg)}

/* ---------- share ---------- */
.share{padding-block:clamp(40px,4.6vw,60px) clamp(34px,4vw,50px)}
.share .wrap{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1fr) minmax(0,1.08fr);gap:clamp(18px,3vw,40px);align-items:center}
.share h2{font-size:clamp(46px,4.5vw,66px);transform:rotate(-8deg);white-space:nowrap}
.share h2 span{display:block}
.share h2 span + span{padding-left:.32em}
.share h2 .scrib{width:70%;margin:12px 0 0 .3em;height:12px}
.share-copy p{text-transform:uppercase;color:var(--fog)}
.share-copy .btn{margin-top:clamp(18px,2vw,26px)}
.share-art{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-width:0}
.share-art .note{transform:rotate(-14deg);width:5.4em;margin-top:-22%}
.share-art .note .scrib{width:70%}

/* ---------- footer ---------- */
.foot{padding-block:clamp(44px,5vw,64px) clamp(26px,3vw,40px)}
.foot .wrap{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"logo nav social" "logo copy legal";gap:24px 40px;align-items:center}
.foot .logo{grid-area:logo}
.foot nav{grid-area:nav}
.foot .copy{grid-area:copy;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.socials{grid-area:social;justify-self:end;display:flex;gap:18px}
.socials button{background:none;border:0;padding:4px;cursor:pointer;display:grid;place-items:center}
.socials svg{width:22px;height:22px}
.legal{grid-area:legal;justify-self:end;display:flex;gap:clamp(16px,2.6vw,40px)}
.legal button{background:none;border:0;padding:4px 0;cursor:pointer;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.legal button:hover,.socials button:hover{opacity:.65}

/* ---------- sheet (dialog) ---------- */
.sheet{border:0;padding:0;background:transparent;max-width:min(620px,calc(100vw - 28px));width:100%;max-height:calc(100dvh - 40px);color:var(--ink)}
.sheet::backdrop{background:rgba(10,10,9,.62)}
.sheet[open]{animation:sheetIn .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes sheetIn{from{transform:translateY(18px) rotate(-1deg);opacity:0}}
.sheet-in{background:var(--paper);border:1.5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:clamp(22px,4vw,40px);max-height:calc(100dvh - 60px);overflow:auto;position:relative}
.sheet-x{position:absolute;top:12px;right:12px;background:none;border:0;cursor:pointer;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:8px}
.sheet-x:hover{text-decoration:underline;text-underline-offset:5px}
.sheet .kicker{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--smoke)}
.sheet h2{font-family:var(--hand);text-transform:uppercase;font-size:clamp(40px,7vw,58px);line-height:.92;margin-top:10px;transform:rotate(-3deg);transform-origin:left;-webkit-text-stroke:.02em currentColor}
.sheet .deck{margin-top:18px;text-transform:uppercase;font-size:12px;color:var(--smoke)}
.sheet .prose{margin-top:20px;display:grid;gap:14px;font-size:14px;line-height:1.8;letter-spacing:.02em;max-width:60ch}
.sheet .sheet-art{max-width:220px;margin-top:20px}
.sheet .sheet-art.dark{padding:18px;background:var(--night)}
.sheet .sheet-art.dark::before{display:none}
.sheet ol{margin:22px 0 0;padding:0;list-style:none;display:grid;gap:14px;counter-reset:s}
.sheet ol li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:8px;font-size:14px;line-height:1.7;letter-spacing:.02em}
.sheet ol li::before{content:counter(s);font-family:var(--hand);font-size:28px;line-height:.9}
.sheet .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.sheet .fine{margin-top:20px;font-size:11.5px;letter-spacing:.06em;color:var(--smoke);line-height:1.7}
.index{list-style:none;margin:22px 0 0;padding:0;border-top:1px dashed rgba(15,15,14,.4)}
.index li{border-bottom:1px dashed rgba(15,15,14,.4)}
.index button{width:100%;text-align:left;background:none;border:0;padding:14px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.index button span{font-weight:400;color:var(--smoke);font-size:11.5px;letter-spacing:.08em}
.index button:hover{text-decoration:underline;text-underline-offset:5px}
/* breathing */
.breath{display:grid;place-items:center;margin-top:22px;height:200px;position:relative}
.breath svg{width:180px;height:180px;overflow:visible}
.breath .orb{transform-box:fill-box;transform-origin:center;transition:transform 4s ease-in-out}
.breath .rays{transform-box:fill-box;transform-origin:center;transition:transform 4s ease-in-out,opacity 4s ease}
.breath-label{text-align:center;font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;min-height:1.8em;font-variant-numeric:tabular-nums}
/* forms */
.field{display:grid;gap:8px;margin-top:18px}
.field label{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.field input[type=text],.field textarea{font:400 14px/1.7 var(--mono);letter-spacing:.02em;color:var(--ink);background:var(--paper-hi);border:1.5px solid var(--ink);padding:10px 12px;width:100%;border-radius:0}
.field textarea{min-height:150px;resize:vertical}
.field input:focus-visible,.field textarea:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:12px;letter-spacing:.06em;line-height:1.6}
.check input{width:18px;height:18px;accent-color:var(--ink);margin-top:2px;flex:none}
.err{color:#8A1C12;font-size:12px;letter-spacing:.06em;min-height:1.4em;margin-top:10px}
.putdown{transition:opacity 1.1s ease,filter 1.1s ease,transform 1.1s ease}
.putdown.gone{opacity:0;filter:blur(3px);transform:translateY(14px)}
/* share steps */
.sheet ol.steps{display:flex;counter-reset:none;gap:0;margin:20px 0 4px}
.sheet .steps li{display:flex;grid-template-columns:none;counter-increment:none;font-size:11px;line-height:1.4;letter-spacing:.14em}
.sheet .steps li::before{content:none}
.sheet .steps li + li::before{content:"";font-family:inherit;font-size:0;line-height:0}
.steps{display:flex;align-items:center;list-style:none;margin:20px 0 4px;padding:0;flex-wrap:wrap;row-gap:8px}
.steps li{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke)}
.steps li + li::before{content:"";width:clamp(22px,7vw,56px);height:1.5px;background:currentColor;opacity:.45;margin-inline:4px 4px}
.steps b{font-family:var(--hand);font-weight:400;font-size:22px;line-height:1;width:32px;height:32px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center;padding-top:3px;letter-spacing:0}
.steps li.on{color:var(--ink)}
.steps li.on b{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps li.done{color:var(--ink)}
.flabel{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);background:transparent;padding:8px 12px 7px;font-size:11.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.chip:hover{background:rgba(15,15,14,.08)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn--back .arr{transform:scaleX(-1)}
.btn--back:hover .arr{transform:scaleX(-1) translateX(4px)}
.recap{margin:20px 0 0;display:grid;gap:0;border-top:1px dashed rgba(15,15,14,.4)}
.recap div{display:grid;grid-template-columns:minmax(110px,.4fr) 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(15,15,14,.4)}
.recap dt{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--smoke)}
.recap dd{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;min-width:0;overflow-wrap:anywhere}
.share-steps{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);flex-wrap:wrap}
.share-steps span{font-family:var(--hand);font-weight:400;font-size:18px;line-height:1;width:26px;height:26px;border:1.3px solid currentColor;border-radius:50%;display:grid;place-items:center;padding-top:2px;letter-spacing:0}
.share-steps i{width:28px;height:1.3px;background:currentColor;opacity:.5}
/* cart */
.cart-list{list-style:none;margin:22px 0 0;padding:0;border-top:1px dashed rgba(15,15,14,.4)}
.cart-list li{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px dashed rgba(15,15,14,.4);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border:1.5px solid var(--ink);background:none;cursor:pointer;line-height:1;font-size:14px}
.qty span{min-width:2ch;text-align:center}
.total{display:flex;justify-content:space-between;margin-top:16px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:tabular-nums}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:var(--paper);padding:11px 18px 10px;font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;z-index:60;transition:transform .3s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100vw - 32px);text-align:center;pointer-events:none}
.toast{visibility:hidden}
.toast.on{transform:translate(-50%,0);visibility:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= shared view bits ================= */
.paperband{background-color:var(--paper);background-image:var(--grain-paper);background-size:160px 160px;color:var(--ink)}
.stories .sec-head .more--deck{margin-left:auto}
.sw{max-width:1120px;margin-inline:auto;padding-inline:clamp(18px,4vw,60px)}

/* ================= story view ================= */
.sv{display:grid;grid-template-columns:clamp(220px,18.5vw,270px) minmax(0,1fr);background:var(--night)}
.sv[hidden]{display:none!important}
.side{position:relative;align-self:stretch;background:var(--night);background-image:var(--grain-night);background-size:160px 160px;color:var(--paper);border-right:1px solid rgba(241,236,224,.2);padding:34px 22px 26px;display:flex;flex-direction:column}
.side .logo{font-size:26px;align-self:flex-start}
.side-nav{list-style:none;margin:34px 0 0;padding:0 0 0 4px;display:grid;gap:10px}
.side-nav a{font-size:var(--fs-0);font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.side-nav a:hover{text-decoration:underline;text-underline-offset:5px}
.side-rule{border:0;border-top:1px solid rgba(241,236,224,.4);margin:26px 4px;width:calc(100% - 8px)}
.side-back{display:inline-flex;align-items:center;gap:10px;font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:4px}
.side-back:hover{text-decoration:underline;text-underline-offset:5px}
.s-list{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:4px}
.s-list a{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:center;padding:10px 8px;text-decoration:none;transition:background-color .15s ease}
.s-list a:hover{background:rgba(241,236,224,.06)}
.s-list a[aria-current="page"]{background:var(--slate)}
.s-thumb{height:52px;display:flex;align-items:flex-end;justify-content:center}
.s-thumb svg{max-height:100%;max-width:100%;width:auto;height:100%}
.s-meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;line-height:1.55;min-width:0}
.s-meta b{display:block;font-weight:500;color:var(--fog)}
.side-foot{margin-top:auto;padding-top:20px}
.side-foot .note{font-size:28px;transform:rotate(-10deg);transform-origin:left;margin:10px 0 22px 6px}
.side-social{display:flex;gap:16px;padding-left:4px}
.side-social button{background:none;border:0;padding:4px;cursor:pointer;color:inherit}
.side-social svg{width:21px;height:21px}
.side-legal{display:grid;gap:4px;justify-items:start;padding-left:4px}
.side-legal button{background:none;border:0;padding:2px 0;cursor:pointer;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:inherit}
.side-copy{margin-top:14px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;line-height:1.6;padding-left:4px;color:var(--fog)}

.smain{min-width:0;position:relative}
.s-top{padding-block:clamp(36px,5vw,70px) clamp(46px,6vw,90px)}
.s-hero{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:clamp(16px,2.5vw,36px);align-items:end}
.s-head{padding-bottom:clamp(10px,3vw,48px);min-width:0}
.s-head h1{font-size:clamp(48px,5.5vw,86px);transform:rotate(-6deg);transform-origin:left center;margin-top:clamp(18px,2.4vw,34px);text-wrap:balance}
.s-by{margin-top:18px;font-size:11.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--fog)}
.s-deck{margin-top:clamp(20px,2.8vw,40px);text-transform:uppercase;font-size:var(--fs-2);line-height:1.7;max-width:34ch}
.s-cw{margin-top:18px;display:inline-block;border:1px solid rgba(241,236,224,.45);padding:7px 11px 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog)}
.s-art{margin:0;min-width:0}
.s-art svg{display:block;width:100%;height:auto;max-height:440px}
.s-story{margin-top:clamp(30px,4vw,56px)}
.s-story .sec-head{margin-bottom:clamp(22px,3vw,36px)}
.s-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(22px,3.4vw,52px);align-items:start}
.s-text{display:grid;gap:1.35em;font-size:var(--fs-2);line-height:1.85;letter-spacing:.03em;max-width:62ch;color:var(--paper)}
.s-text .pending{border:1px dashed rgba(241,236,224,.45);padding:18px 18px 16px;color:var(--fog);font-size:13px}
.s-text .pending a{color:var(--paper)}
.s-side{display:grid;gap:14px;min-width:0}
.panel{position:relative;border:1.5px solid rgba(241,236,224,.85);margin:0;padding:6px}
.panel svg{display:block;width:100%;height:auto}
.pnote{position:absolute;font-family:var(--hand);text-transform:uppercase;line-height:1.02;font-size:clamp(12px,1.22vw,18px);transform:rotate(-7deg);transform-origin:left top;width:24%;color:var(--paper);-webkit-text-stroke:.01em currentColor}
.s-aside{display:grid;justify-items:center;gap:20px;padding-top:10px}
.s-aside .note{font-size:clamp(26px,2.6vw,36px);transform:rotate(-8deg);text-align:center;max-width:9em}
.s-aside .care{border:1px solid rgba(241,236,224,.35);padding:16px 18px;font-size:12px;letter-spacing:.06em;line-height:1.7;color:var(--fog);max-width:40ch}

.s-prac{padding-block:clamp(44px,5vw,70px) clamp(50px,6vw,80px)}
.s-prac .sec-head{margin-bottom:clamp(14px,2vw,22px)}
.sp-hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(16px,3vw,40px);align-items:center}
.sp-copy h2{font-size:clamp(46px,5.4vw,82px);transform:rotate(-5deg);transform-origin:left center;text-wrap:balance;margin-top:8px}
.sp-copy p{margin-top:clamp(22px,3vw,38px);text-transform:uppercase;max-width:38ch;font-size:var(--fs-1)}
.sp-art{margin:0;min-width:0}
.sp-art svg{display:block;width:100%;height:auto;max-height:380px}
.p-grid{list-style:none;margin:clamp(30px,4vw,52px) 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(15,15,14,.18)}
.p-grid li{position:relative;padding:clamp(22px,2.4vw,30px) clamp(16px,2.4vw,34px) clamp(26px,2.6vw,34px);border-right:1px solid rgba(15,15,14,.18);border-bottom:1px solid rgba(15,15,14,.18);min-width:0;display:flex;flex-direction:column}
.p-grid li:nth-child(3n){border-right:0}
.p-num{position:absolute;top:clamp(16px,1.8vw,22px);left:clamp(10px,1.2vw,16px);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:10.5px;font-weight:500;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.p-icon{height:clamp(62px,6.4vw,84px);display:flex;align-items:flex-end;justify-content:center;margin:0 0 18px}
.p-icon svg{height:100%;width:auto;max-width:100%}
.p-grid h3{font-family:var(--mono);font-weight:500;font-size:var(--fs-2);letter-spacing:.12em;text-transform:uppercase;padding-left:clamp(0px,1.2vw,18px)}
.p-grid p{margin-top:10px;text-transform:uppercase;font-size:var(--fs-0);line-height:1.75;color:var(--smoke);padding-left:clamp(0px,1.2vw,18px)}
.p-grid.steps-only li{padding-top:clamp(60px,5.4vw,70px)}
.p-after{margin-top:26px;font-size:12.5px;letter-spacing:.05em;line-height:1.75;max-width:70ch;color:var(--smoke)}
.s-pager{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:clamp(30px,4vw,48px)}
.s-pager a{display:inline-flex;align-items:center;gap:10px;font-size:var(--fs-0);font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-decoration:underline;text-underline-offset:6px}
.s-pager a.prev .arr{transform:scaleX(-1)}
.s-pager a.prev:hover .arr{transform:scaleX(-1) translateX(4px)}
.sv .share{padding-block:clamp(40px,4.6vw,60px) clamp(34px,4vw,50px)}
.share-in{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:center}
.s-foot .foot-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"logo nav nav" "logo copy legal";gap:20px 40px;align-items:center}
.s-foot .logo{grid-area:logo}
.s-foot nav{grid-area:nav;justify-self:center}
.s-foot .copy{grid-area:copy;justify-self:center}

/* ================= dark sheet (stories) ================= */
.sheet.is-dark{color:var(--paper)}
.sheet.is-dark .sheet-in{background:var(--night);background-image:var(--grain-night);background-size:160px 160px;border-color:rgba(241,236,224,.6);box-shadow:8px 8px 0 rgba(241,236,224,.22)}
.is-dark .kicker,.is-dark .deck,.is-dark .fine,.is-dark .index button span{color:var(--fog)}
.is-dark .field input[type=text],.is-dark .field textarea{background:#1D1D1C;color:var(--paper);border-color:rgba(241,236,224,.7)}
.is-dark .field input::placeholder,.is-dark .field textarea::placeholder{color:rgba(241,236,224,.45)}
.is-dark .field input:focus-visible,.is-dark .field textarea:focus-visible{outline-color:var(--paper)}
.is-dark .err{color:#FFAE9B}
.is-dark .steps li{color:var(--fog)}
.is-dark .steps li.on,.is-dark .steps li.done{color:var(--paper)}
.is-dark .steps li.on b{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.is-dark .index,.is-dark .index li{border-color:rgba(241,236,224,.35)}
.is-dark .btn--ink{background:var(--paper);color:var(--ink)}
.is-dark .btn--line{color:var(--paper);border-color:var(--paper)}
.is-dark .btn--line:hover{background:var(--paper);color:var(--ink)}
.pblock{border-top:1px dashed rgba(15,15,14,.35);margin-top:22px;padding-top:4px;position:relative}
.pblock:first-of-type{border-top:0;margin-top:6px;padding-top:0}
.pblock h3{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:14px;color:var(--smoke)}
.pblock .rm{position:absolute;right:0;top:12px;background:none;border:0;cursor:pointer;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--smoke);padding:4px}
.pblock .rm:hover{color:var(--ink);text-decoration:underline}
.addp{margin-top:16px;background:none;border:1.5px dashed var(--ink);padding:10px 14px 9px;cursor:pointer;font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;width:100%}
.addp:hover{background:rgba(15,15,14,.06)}
.mycard{width:min(260px,100%);aspect-ratio:5/7;position:relative;margin-top:20px}
.mycard .dcard{position:absolute;inset:0}
.mycard .dc-face{padding:18px}
.mycard .dc-title{font-size:30px}

/* ================= responsive for views ================= */
@media (max-width:1080px){
  .share-in{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .share-in .share-art{grid-column:1 / -1;max-width:560px;justify-self:center;width:100%}
}
@media (max-width:900px){
  .sv{grid-template-columns:minmax(0,1fr)}
  .side{position:relative;height:auto;overflow:visible;border-right:0;border-bottom:1px solid rgba(241,236,224,.2);padding:18px var(--gutter) 14px;display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:16px}
  .side .logo{font-size:22px}
  .side nav{justify-self:end}
  .side-nav{margin:0;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 16px}
  .side-rule,.side-foot{display:none}
  .side-back{grid-column:1 / -1;margin-top:16px;justify-self:start}
  .s-list{grid-column:1 / -1;display:flex;overflow-x:auto;gap:8px;margin-top:8px;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:none}
  .s-list::-webkit-scrollbar{display:none}
  .s-list li{flex:0 0 auto;scroll-snap-align:start}
  .s-list a{grid-template-columns:44px auto;gap:10px;padding:8px 12px 8px 8px}
  .s-thumb{height:40px}
  .s-meta{font-size:10px;white-space:nowrap}
  .s-hero,.s-grid,.sp-hero{grid-template-columns:minmax(0,1fr)}
  .s-head{padding-bottom:0}
  .s-art{max-width:520px}
  .p-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .p-grid li:nth-child(3n){border-right:1px solid rgba(15,15,14,.18)}
  .p-grid li:nth-child(2n){border-right:0}
  .s-foot .foot-in{grid-template-columns:1fr;grid-template-areas:"logo" "nav" "copy" "legal";justify-items:start}
  .s-foot nav,.s-foot .copy{justify-self:start}
  .s-foot nav{width:100%}
  .s-foot .nav{gap:8px 20px;flex-wrap:wrap;justify-content:flex-start}
  .dv-main{grid-template-columns:minmax(0,1fr)}
  .dv-stage{order:-1}
  .dv-copy h1{font-size:clamp(44px,12vw,64px)}
}
@media (max-width:640px){
  .stories .sec-head{flex-wrap:wrap;row-gap:6px}
  .stories .sec-head h2{flex-basis:100%}
  .stories .sec-head .more--deck{margin-left:0}
  .share-in{grid-template-columns:minmax(0,1fr)}
  .dv-bar{display:flex;justify-content:space-between}
  .dv-bar .logo{display:none}
}
@media (max-width:520px){
  .p-grid{grid-template-columns:minmax(0,1fr)}
  .p-grid li,.p-grid li:nth-child(3n){border-right:0}
  .side-nav{gap:4px 12px}
  .side-nav a{font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){
  .dcard,.dc-inner{transition:none}
}

/* ================= line-art creatures on dark ================= */
.p-body{display:none}

/* ================= shared bits ================= */
.fp-row{display:flex;gap:14px 22px;flex-wrap:wrap;align-items:center;margin-top:20px}
.btn--ghost{background:transparent;color:var(--paper);border-color:rgba(241,236,224,.75)}
.btn--ghost:hover{background:var(--paper);color:var(--ink)}
.top-book{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.top-book:hover{text-decoration:underline;text-underline-offset:5px}
.top .top-cta{display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);padding:11px 16px 10px;line-height:1;transition:background .15s,color .15s}
.top .top-cta:hover{background:transparent;color:var(--ink)}
.top .top-cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.nav a[aria-current="page"]::after{transform:scaleX(1)}
.hero-cta{margin-top:clamp(18px,2vw,26px)}
.hero-copy .hero-cta .btn,.feat-body .fp-row .btn{margin-top:0}
.feat-body .fp-row{margin-top:clamp(20px,2.4vw,30px)}
.dark .textlink{color:var(--paper)}
.stories .sec-head .more--all{margin-left:clamp(14px,2vw,28px)}
.s-head .fp-row{margin-top:24px}
.pv[hidden]{display:none!important}
.top[hidden],.foot[hidden]{display:none!important}

/* ================= home: book band ================= */
.book-band{padding-block:clamp(60px,7vw,110px)}
.bb-in{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,5vw,80px);align-items:center}
.bb-h{font-family:var(--serif);font-weight:400;font-size:clamp(52px,6vw,92px);line-height:.94;letter-spacing:-.015em}
.bb-h span{display:block}
.bb-h span + span{font-style:italic}
.bb-copy > p{margin-top:24px;text-transform:uppercase;max-width:42ch}
.bb-copy .fp-row{margin-top:26px}
.bb-mock{display:grid;grid-template-columns:1fr 1fr;width:min(580px,100%);justify-self:center;aspect-ratio:1.4;box-shadow:0 26px 44px -18px rgba(30,25,15,.55);transform:rotate(-2deg);text-decoration:none;color:inherit;transition:transform .35s ease}
.bb-mock:hover{transform:rotate(-.6deg) translateY(-5px)}
.bb-page{position:relative;display:flex;flex-direction:column;padding:9% 8% 8%;min-width:0;overflow:hidden}
.bb-dark{background:var(--night);background-image:var(--grain-night);background-size:160px 160px;color:var(--paper)}
.bb-light{background:var(--paper-hi);color:var(--ink)}

.feat-by{font-size:var(--fs-0);font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--fog);margin-bottom:12px}

/* ================= zine shelf ================= */
.shelf-sec{padding-block:clamp(16px,2vw,30px) clamp(70px,8vw,120px)}
.shelf-head{display:flex;align-items:center;gap:clamp(14px,2vw,26px);margin-bottom:clamp(26px,3vw,40px)}
.shelf-head h2{font-size:clamp(34px,3.4vw,46px);transform:rotate(-4deg);transform-origin:left center;white-space:nowrap}
.shelf-count{margin-left:auto;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;font-variant-numeric:tabular-nums}
.zshelf{display:grid;gap:clamp(40px,5vw,70px)}
.zrow{list-style:none;margin:0;padding:0 clamp(10px,2vw,30px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,2.6vw,40px);align-items:end;position:relative}
.zrow::after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:14px;border-top:3px solid var(--ink);border-bottom:1.5px solid var(--ink);background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(15,15,14,.18) 22px 23px);box-shadow:0 12px 18px -10px rgba(30,25,15,.45)}
.zslot{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center}
.zcov{--tilt:0deg;position:relative;display:flex;flex-direction:column;width:100%;aspect-ratio:5/7;max-width:100%;padding:9% 9% 7%;text-decoration:none;color:var(--paper);background:var(--night);background-image:var(--grain-night);background-size:160px 160px;border:0;cursor:pointer;text-align:left;font:inherit;transform:rotate(var(--tilt));transform-origin:50% 100%;transition:transform .3s cubic-bezier(.3,1.5,.5,1),box-shadow .3s ease;box-shadow:3px 4px 0 rgba(15,15,14,.22)}
.zcov::before,.zcov::after,.staple{content:"";position:absolute;left:7px;width:4px;height:clamp(16px,9%,26px);border-radius:1px;background:linear-gradient(90deg,#8d8a82,#e6e3dc 45%,#a29f97 70%,#77746d);box-shadow:0 0 0 .5px rgba(0,0,0,.6),1px 1px 0 rgba(0,0,0,.45)}
.zcov::before,.staple.s1{top:22%}
.zcov::after,.staple.s2{bottom:22%}
.zcov.open:hover,.zcov.open:focus-visible{transform:rotate(0deg) translateY(-14px);box-shadow:8px 18px 22px -8px rgba(15,15,14,.5)}
.zc-num{font-size:clamp(9px,.75vw,11px);font-weight:500;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.zc-art{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:6% 0}
.zc-art .art{width:100%;height:100%}
.zc-title{font-family:var(--serif);font-size:clamp(22px,2.3vw,36px);line-height:.95;letter-spacing:-.01em}
.zc-by{margin-top:6px;font-size:clamp(8.5px,.7vw,10.5px);letter-spacing:.14em;text-transform:uppercase;opacity:.75;min-height:1.2em}
.zc-foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid rgba(241,236,224,.3);font-size:clamp(7.5px,.62vw,9.5px);letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.z-tag{position:absolute;top:-12px;right:8%;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;background:var(--paper-hi);color:var(--ink);border:1.5px solid var(--ink);padding:3px 7px 2px;transform:rotate(4deg);pointer-events:none}
.zcov.locked{background-color:#1b1b1a;color:rgba(241,236,224,.7)}
.zcov.locked .zc-art{filter:blur(5px);opacity:.42}
.zcov.locked .zc-title{font-style:italic;opacity:.85}
.zcov.locked:hover,.zcov.locked:focus-visible{transform:rotate(0deg) translateY(-6px)}
.zc-lock{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-34px 0 0 -22px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center}
.zc-lock svg{width:22px;height:22px}
.zslot:has(.locked) .z-tag{background:transparent;color:var(--smoke);border-color:rgba(15,15,14,.35)}
.sub{padding-block:clamp(60px,7vw,110px)}
.sub-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(26px,5vw,80px);align-items:center}
.sub-h{font-family:var(--serif);font-weight:400;font-size:clamp(50px,5.6vw,88px);line-height:.94;letter-spacing:-.015em}
.sub-h span{display:block}
.sub-h span + span{font-style:italic}
.sub-copy > p{margin-top:22px;font-size:14px;line-height:1.8;letter-spacing:.02em;color:var(--fog);max-width:46ch}
.sub-form{border:1.5px solid rgba(241,236,224,.4);padding:clamp(22px,3vw,40px);display:grid;gap:12px;min-width:0}
.sub-form label{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.sub-row{display:flex;gap:10px;flex-wrap:wrap}
.sub-row input{flex:1 1 220px;min-width:0;font:400 15px/1.4 var(--mono);letter-spacing:.02em;color:var(--paper);background:#1D1D1C;border:1.5px solid rgba(241,236,224,.7);padding:12px 14px;border-radius:0}
.sub-row input::placeholder{color:rgba(241,236,224,.4)}
.sub-row input:focus-visible{outline:2px dashed var(--paper);outline-offset:3px}
.sub-msg{min-height:1.4em;font-size:13px;line-height:1.6;letter-spacing:.02em}
.sub-fine{font-size:11.5px;letter-spacing:.06em;color:var(--fog)}
@media (max-width:900px){.zrow{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:clamp(50px,8vw,70px)}.zrow::after{display:none}.zslot::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-14px;height:10px;border-top:3px solid var(--ink)}.sub-in{grid-template-columns:minmax(0,1fr)}}

/* ================= zine flip book ================= */
.bk{--paper-bk:#E3DCCD}
.bk-index{position:absolute;z-index:45;top:58px;right:var(--gutter);width:min(340px,calc(100vw - 32px));max-height:calc(100% - 140px);overflow:auto;background:var(--paper-hi);border:1.5px solid var(--ink);box-shadow:8px 8px 0 rgba(15,15,14,.18);padding:16px 18px 18px}
.bk-index[hidden]{display:none}
.bki-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
.bki-head p{font-family:var(--serif);font-size:26px;line-height:1}
.bki-x{background:none;border:0;cursor:pointer;font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:6px 0}
.bki-list{list-style:none;margin:0;padding:0}
.bki-part{font-family:var(--hand);text-transform:uppercase;font-size:19px;line-height:1;margin:14px 0 4px;transform:rotate(-2deg);transform-origin:left}
.bki-list button{width:100%;display:flex;align-items:baseline;gap:10px;background:none;border:0;border-bottom:1px dashed rgba(15,15,14,.3);padding:9px 0 8px;cursor:pointer;text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--smoke)}
.bki-list button span:first-child{flex:1 1 auto}
.bki-list button:hover,.bki-list button.on{color:var(--ink)}
.bki-list button.on{font-weight:500}
.bki-list button.on span:first-child::before{content:"\2192 "}
.bki-pg{font-size:11px;font-variant-numeric:tabular-nums}
.bk-toc[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.bpage .staple{position:absolute;left:9px;width:4px;height:7%;border-radius:1px;background:linear-gradient(90deg,#8d8a82,#e6e3dc 45%,#a29f97 70%,#77746d);box-shadow:0 0 0 .5px rgba(0,0,0,.6),1px 1px 0 rgba(0,0,0,.45);z-index:2}
.bpage .staple.s1{top:22%}
.bpage .staple.s2{bottom:22%}
.zback .staple{left:auto;right:9px}
.zcp{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.zcp-num{font-size:calc(var(--bf) * .66);letter-spacing:.2em;text-transform:uppercase;opacity:.75;margin:0!important}
.zcp-art{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:6% 0}
.zcp-art .art{width:100%;height:100%}
.zcp-title{margin:0;font-family:var(--serif);font-weight:400;font-size:calc(var(--bf) * 4.4);line-height:.86;letter-spacing:-.03em}
.zcp-by{margin:.8em 0 0!important;font-size:calc(var(--bf) * .7);letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.zcp-foot{display:flex;justify-content:space-between;gap:1em;margin:1em 0 0!important;padding-top:.7em;border-top:1px solid rgba(241,236,224,.3);font-size:calc(var(--bf) * .58);letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.zcover .bo-cw{margin-top:1em!important}
.zend .bp-body{justify-content:center}
.zend .end-h em{font-style:italic}
.zend .endc p{opacity:.85}
.zend .end-links a{color:var(--paper)}

/* ================= story mode: the book ================= */
.bk[hidden]{display:none!important}
body.bk-open{overflow:hidden}
.bk{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background-color:#E3DCCD;background-image:var(--grain-paper);background-size:160px 160px;color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--pw:400px;--ph:570px;--bf:14px;--px:44px;--pt:48px;--pb:48px}
.bk-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px var(--gutter) 6px}
.bk-close{justify-self:start;display:inline-flex;align-items:center;gap:10px;font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:8px 0}
.bk-close:hover{text-decoration:underline;text-underline-offset:5px}
.bk-where{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--smoke);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.bk-toc{justify-self:end;background:none;border:1.5px solid var(--ink);padding:8px 12px 7px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.bk-toc:hover{background:var(--ink);color:var(--paper)}
.bk-stage{flex:1 1 auto;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;touch-action:pan-y}
.book{position:relative;width:calc(var(--pw) * 2);height:var(--ph);perspective:calc(var(--pw) * 3.4);outline:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.book.single{width:var(--pw)}
.book:focus-visible{outline:2px dashed var(--ink);outline-offset:12px}
.bk-slot{position:absolute;top:0;width:var(--pw);height:var(--ph)}
.bk-l{left:0}
.bk-r{left:var(--pw)}
.book.single .bk-l{display:none}
.book.single .bk-r{left:0}
.bk-l:not(:empty){box-shadow:0 22px 40px -18px rgba(30,25,15,.6),-2px 1px 0 #d4ccbc,-4px 2px 0 #c7beac,-5px 3px 0 #b9af9b}
.bk-r:not(:empty){box-shadow:0 22px 40px -18px rgba(30,25,15,.6),2px 1px 0 #d4ccbc,4px 2px 0 #c7beac,5px 3px 0 #b9af9b}
.bk-arrow{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;display:grid;place-items:center;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.bk-arrow svg,.bk-btn svg{width:20px;height:10px}
.bk-arrow:hover{background:var(--ink);color:var(--paper)}
.bk-arrow:disabled,.bk-btn:disabled{opacity:.25;cursor:default}
.bk-arrow:disabled:hover{background:transparent;color:inherit}
.bk-prev{left:clamp(12px,2vw,30px)}
.bk-next{right:clamp(12px,2vw,30px)}
.bk-bar{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px var(--gutter) 16px}
.bk-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none}
.bk-prog{display:flex;align-items:center;gap:14px;min-width:0;width:min(460px,100%)}
.bk-prog input{flex:1 1 auto;min-width:0;accent-color:var(--ink)}
.bk-count{font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:12ch;text-align:right}
.bk-measure{position:absolute;left:-10000px;top:0;width:var(--pw);height:var(--ph);visibility:hidden;pointer-events:none}

/* pages */
.bpage{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;padding:var(--pt) var(--px) var(--pb);font-size:var(--bf);line-height:1.72;letter-spacing:.02em;text-align:left}
.bpage.bdark{background-color:var(--night);background-image:var(--grain-night);background-size:160px 160px;color:var(--paper)}
.bpage.bwhite{background-color:var(--paper-hi);color:var(--ink)}
.bpage.pback{background-color:#E8E1D2;background-image:var(--grain-paper);background-size:160px 160px}
.bpage::after{content:"";position:absolute;top:0;bottom:0;width:14%;pointer-events:none}
.bpage.side-l::after{right:0;background:linear-gradient(to left,rgba(60,50,30,.22),rgba(60,50,30,0))}
.bpage.side-r::after{left:0;background:linear-gradient(to right,rgba(60,50,30,.22),rgba(60,50,30,0))}
.bpage.side-s::after{left:0;width:5%;background:linear-gradient(to right,rgba(60,50,30,.2),rgba(60,50,30,0))}
.bpage.bdark.side-l::after{background:linear-gradient(to left,rgba(0,0,0,.55),rgba(0,0,0,0))}
.bpage.bdark.side-r::after,.bpage.bdark.side-s::after{background:linear-gradient(to right,rgba(0,0,0,.55),rgba(0,0,0,0))}
.bp-body{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.bpage.btext .bp-body,.bpage.bprac .bp-body,.bpage.front .bp-body{display:block}
.bp-body p{margin:0 0 .95em}
.bp-head{position:absolute;top:calc(var(--pt) * .4);left:var(--px);right:var(--px);font-size:calc(var(--bf) * .6);letter-spacing:.16em;text-transform:uppercase;opacity:.55;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-l .bp-head{text-align:left}
.side-r .bp-head,.side-s .bp-head{text-align:right}
.bp-num{position:absolute;bottom:calc(var(--pb) * .4);left:0;right:0;text-align:center;font-size:calc(var(--bf) * .64);letter-spacing:.12em;opacity:.55;font-variant-numeric:tabular-nums;line-height:1}
.bpage a{color:inherit;text-decoration:underline;text-underline-offset:4px}
.bpage .arr{width:1.2em;height:.6em;vertical-align:middle}

/* cover + back cover */
.cv,.bc{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:0}
.cv-top{font-size:calc(var(--bf) * .64);letter-spacing:.22em;text-transform:uppercase;opacity:.7}
.cv-art{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:4% 0}
.cv-art .art{width:92%;height:100%}
.bp-body .cv-title{margin:0;font-family:var(--serif);font-weight:400;font-size:calc(var(--bf) * 3.5);line-height:.92;letter-spacing:-.02em}
.cv-title em{font-style:italic}
.bp-body .cv-sub{margin:1.8em auto .6em;max-width:26em;line-height:1.7;font-size:calc(var(--bf) * .66);letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.bc{justify-content:center;gap:1.2em}
.bc-art{width:46%;height:32%;display:flex;align-items:center;justify-content:center}
.bc-art .art{width:100%;height:100%}
.bc-logo{font-family:var(--hand);text-transform:uppercase;font-size:calc(var(--bf) * 2.1);line-height:.9;transform:rotate(-6deg)}
.bc-sub{font-size:calc(var(--bf) * .66);letter-spacing:.16em;text-transform:uppercase;opacity:.7;line-height:1.7}

/* front matter */
.tp-logo{font-family:var(--hand);text-transform:uppercase;font-size:calc(var(--bf) * 2.7);line-height:.88;transform:rotate(-6deg);transform-origin:left;margin:.4em 0 1.4em !important}
.tp-label{font-size:calc(var(--bf) * .64);letter-spacing:.18em;text-transform:uppercase;opacity:.6;border-top:1px solid currentColor;padding-top:.9em}
.tp-p{font-size:calc(var(--bf) * .95)}
.tp-p:nth-of-type(3){font-family:var(--serif);font-size:calc(var(--bf) * 1.7);line-height:1.05;letter-spacing:-.01em}
.ct-h{font-family:var(--serif);font-weight:400;font-size:calc(var(--bf) * 2.6);line-height:1;margin:0 0 .9em}
.ct-row{display:flex;align-items:baseline;gap:.7em;width:100%;background:none;border:0;padding:.62em 0;border-top:1px dashed rgba(15,15,14,.35);cursor:pointer;font-size:calc(var(--bf) * .86);letter-spacing:.06em;text-align:left;color:inherit}
.ct-row:hover .ct-t{text-decoration:underline;text-underline-offset:4px}
.ct-num{font-size:.8em;opacity:.6;font-variant-numeric:tabular-nums}
.ct-t{text-transform:uppercase;font-weight:500;min-width:0}
.ct-dots{flex:1 1 auto;border-bottom:1.5px dotted rgba(15,15,14,.35);transform:translateY(-.25em);min-width:1em}
.ct-pg{font-variant-numeric:tabular-nums}
.bblank .bp-body{align-items:center;justify-content:center}
.blank-note{font-family:var(--serif);font-style:italic;font-size:calc(var(--bf) * 1.1);text-align:center;opacity:.45;line-height:1.3}
.endc{display:flex;flex-direction:column;justify-content:center;height:100%}
.end-h{font-family:var(--serif);font-weight:400;font-size:calc(var(--bf) * 3);line-height:.95;margin:0 0 .6em}
.end-h em{font-style:italic}
.end-links{display:grid;gap:.6em;margin-top:.6em;font-size:calc(var(--bf) * .82);letter-spacing:.12em;text-transform:uppercase;font-weight:500}

/* story opener */
.bo{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.bo-kicker{font-size:calc(var(--bf) * .66);letter-spacing:.18em;text-transform:uppercase;opacity:.72}
.bo-art{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:5% 0}
.bo-art .art{width:100%;height:100%}
.bo-title{font-family:var(--serif);font-weight:400;font-size:calc(var(--bf) * 2.9);line-height:.95;letter-spacing:-.015em;text-wrap:balance}
.bo-by{margin:.6em 0 0 !important;font-size:calc(var(--bf) * .66);letter-spacing:.16em;text-transform:uppercase;opacity:.72}
.bo-deck{margin:.9em 0 0 !important;font-size:calc(var(--bf) * .74);letter-spacing:.08em;text-transform:uppercase;line-height:1.6;opacity:.85}
.bo-cw{margin:.9em 0 0 !important;align-self:flex-start;font-size:calc(var(--bf) * .6);letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;padding:.5em .7em .4em;opacity:.7}

/* comic panels page */
.bpanels{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:3%;min-height:0}
.bpanels .panel{margin:0;padding:4px;display:flex;justify-content:center}
.bpanels .panel svg{width:auto;max-width:100%;height:auto;max-height:calc((var(--ph) - var(--pt) - var(--pb)) / 3.45)}
.bpanels .pnote{font-size:calc(var(--bf) * .95)}

/* practice pages */
.pp-head{margin-bottom:.4em}
.pp-label{font-size:calc(var(--bf) * .64);letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin:0 !important}
.pp-title{font-family:var(--serif);font-weight:400;font-size:calc(var(--bf) * 2.05);line-height:.98;letter-spacing:-.01em;margin:.3em 0 .5em;text-wrap:balance}
.pp-intro{font-size:calc(var(--bf) * .82);line-height:1.6;opacity:.8}
.pp-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.15em 1em;align-items:start;padding:.75em 0;border-top:1px dashed rgba(15,15,14,.3)}
.pp-item.noic{grid-template-columns:minmax(0,1fr)}
.pi-ic{grid-row:span 2;width:calc(var(--bf) * 3.4);height:calc(var(--bf) * 2.6);display:flex;align-items:flex-end}
.pi-ic .art{width:100%;height:100%}
.pi-n{grid-row:span 2;font-family:var(--hand);font-size:calc(var(--bf) * 1.9);line-height:.9;min-width:1.1em}
.pp-item h4{margin:0;font-family:var(--mono);font-weight:500;font-size:calc(var(--bf) * .8);letter-spacing:.12em;text-transform:uppercase;line-height:1.35}
.pp-item p{margin:0 !important;font-size:calc(var(--bf) * .84);line-height:1.6}
.pp-care{font-size:calc(var(--bf) * .74);line-height:1.6;opacity:.8;border-top:1px dashed rgba(15,15,14,.3);padding-top:.75em}
.pp-link{font-size:calc(var(--bf) * .72);letter-spacing:.12em;text-transform:uppercase;font-weight:500;margin-top:.4em !important}

/* the turning leaf */
.bk-leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;z-index:6;will-change:transform;pointer-events:none}
.bk-leaf.at-r{left:var(--pw);transform-origin:0 50%}
.bk-leaf.at-l{left:0;transform-origin:100% 50%}
.bk-leaf.at-s{left:0;transform-origin:0 50%}
.bk-leaf.go{transition:transform .78s cubic-bezier(.42,.08,.22,1)}
.bk-leaf .lf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.bk-leaf .lf-b{transform:rotateY(180deg)}
.bk-leaf .shade{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.05),rgba(0,0,0,.4))}
.bk-leaf.go .shade{animation:leafShade .78s ease-in-out}
.bk-leaf.at-l .shade{background:linear-gradient(270deg,rgba(0,0,0,.05),rgba(0,0,0,.4))}
@keyframes leafShade{50%{opacity:1}}
.bk-leaf.at-s.go{transition-duration:.65s}

@media (max-width:1080px){
  .slist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .send{grid-column:1 / -1;min-height:0}
}
@media (max-width:900px){
  .bb-in,.pg-hero-in,.ab-hero-in,.ab-cta-in{grid-template-columns:minmax(0,1fr)}
  .bb-mock{width:min(520px,100%)}
  .pg-art{max-width:420px;justify-self:center;width:100%}
  .ab-art{max-width:460px;justify-self:center;width:100%}
  .ab-cta-art{margin:0 calc(-1 * var(--gutter))}
  .bk-arrow{display:none}
}
@media (max-width:640px){
  .slist{grid-template-columns:minmax(0,1fr)}
  .sitem.feat{grid-column:auto}
  .sitem.feat .si-story{display:flex}
  .sitem.feat .si-art{min-height:0;height:clamp(140px,40vw,190px);margin:16px 0 20px}
  .sitem.feat .si-title{font-size:clamp(30px,8vw,42px);align-self:auto}
  .pair-cards{grid-template-columns:minmax(0,1fr)}
  .pc-plus{justify-self:center}
  .pc-story,.pc-prac{min-height:0}
  .stories .sec-head .more--all{margin-left:0}
  .bk-top{grid-template-columns:auto 1fr auto}
  .bk-where{max-width:none}
  .bk-count{min-width:0;font-size:10px}
  .top-book{font-size:10.5px}
  .top .top-cta{font-size:10.5px;padding:9px 12px 8px;gap:8px}
}
@media (prefers-reduced-motion:reduce){
  .bb-mock,.si-link{transition:none}
}

/* ================= editorial serif titles ================= */
.hero h1,.st-h1,.featured h2,.prac-hero h2,.share h2,.s-head h1,.sp-copy h2,.dv-copy h1,.sh-hero h1,.sh-prac-hero h2,.sheet h2,.fp-h,.dc-title,.think h3,.dend h3{
  font-family:var(--serif);font-weight:400;font-style:normal;text-transform:none;letter-spacing:-.015em;-webkit-text-stroke:0;transform:none;line-height:.94;text-wrap:balance}
.hero h1 span + span,.featured h2 span + span,.prac-hero h2 span + span,.share h2 span + span,.dv-copy h1 span + span,.sh-hero h1 span + span,.sh-prac-hero h2 span:nth-child(2),.sh-prac-hero h2 span:nth-child(3){padding-left:0}
.hero h1 span + span,.st-h1 span + span,.featured h2 span + span,.prac-hero h2 span + span,.share h2 span + span,.dv-copy h1 span + span,.sh-hero h1 span + span,.sh-prac-hero h2 span:last-child,.think h3{font-style:italic}
.hero h1{font-size:clamp(64px,9.4vw,144px);letter-spacing:-.025em}
.st-h1{font-size:clamp(62px,8vw,128px);letter-spacing:-.02em}
.featured h2{font-size:clamp(60px,7.6vw,116px)}
.prac-hero h2{font-size:clamp(50px,5.4vw,84px)}
.share h2{font-size:clamp(50px,4.8vw,74px)}
.share h2 .scrib{margin-left:0}
.s-head h1{font-size:clamp(54px,6vw,96px)}
